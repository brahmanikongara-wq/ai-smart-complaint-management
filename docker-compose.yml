version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resolvai_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=super_secret_jwt_key_resolvai_platform_2026
      - JWT_REFRESH_SECRET=super_secret_jwt_refresh_key_resolvai_platform_2026
      - CLIENT_URL=http://localhost:3000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - backend_data:/app/prisma
      - backend_uploads:/app/uploads
    networks:
      - resolvai_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resolvai_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - resolvai_network

volumes:
  backend_data:
  backend_uploads:

networks:
  resolvai_network:
    driver: bridge
